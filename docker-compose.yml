services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-methflix}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Domain/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-methflix}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__PostgradeSQL: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-methflix};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-changeme};"
      StorageManager__Internal: /data/movies
      StorageManager__TorrentStorage: /data/torrents
      StorageManager__StreamSegments: /data/streaming
      StorageManager__DownloadFolder: /data/streaming
    ports:
      - "5000:5000"
    volumes:
      - movies_data:/data/movies
      - torrents_data:/data/torrents
      - streaming_data:/data/streaming

volumes:
  postgres_data:
  movies_data:
  torrents_data:
  streaming_data:
